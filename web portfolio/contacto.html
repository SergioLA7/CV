<main class="contenedor-contacto">

    <h1 class="titulo-seccion">¡Ponte en contacto conmigo cuando quieras!</h1>

    <div class="formulario-contacto">
        <form id="form-contacto">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>

            <label for="asunto">Asunto</label>
            <input type="text" id="asunto" name="asunto" placeholder="Asunto del mensaje" required>

            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje aquí..." rows="6" required></textarea>

            <button type="submit" class="boton-enviar">Enviar mensaje</button>
        </form>
    </div>

</main>

<footer>
    <p>© 2026 · Sergio López Aguado</p>
</footer>

<script>
    // Pop-up al enviar el formulario
    document.getElementById('form-contacto').addEventListener('submit', function(e) {
        e.preventDefault(); // Evita el envío real
        alert('¡Mensaje enviado correctamente!');
        this.reset(); // Limpia el formulario
    });
</script>

</body>
